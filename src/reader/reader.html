<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusRead</title>
<link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="../content/content.css">
</head>
<body>

<header class="bar fr-ignore">
  <div class="brand">
    <img src="../../icons/icon32.png" alt="" width="20" height="20">
    <span>FocusRead</span>
  </div>

  <div class="file" id="fileName" title="">No document open</div>

  <div class="grow"></div>

  <div class="modes" id="modes" hidden>
    <button data-mode="reflow" class="on" title="Clean, reflowed text - full reading features">Reading view</button>
    <button data-mode="original" title="The original page images">Original layout</button>
  </div>

  <div class="pager" id="pager" hidden>
    <button id="pagePrev" title="Previous page">&#8249;</button>
    <input id="pageNum" type="number" min="1" value="1" aria-label="Page number">
    <span id="pageCount">/ 0</span>
    <button id="pageNext" title="Next page">&#8250;</button>
  </div>

  <button id="openBtn" class="ghost">Open file</button>
  <button id="optionsBtn" class="ghost" title="Settings">Settings</button>
</header>

<main id="stage">
  <section id="drop" class="drop">
    <div class="dropInner">
      <h1>Open a paper</h1>
      <p class="lead">Drop a <strong>PDF</strong> or <strong>.docx</strong> here, or choose a file.</p>
      <button id="pickBtn" class="primary">Choose a file</button>
      <input type="file" id="fileInput" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
      <p class="fine">
        Nothing is uploaded. The file is read inside your browser.
        Translation sends only the sentences you ask for, to the provider you chose in settings.
      </p>
      <div id="dropError" class="error" hidden></div>
    </div>
  </section>

  <section id="status" class="status" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <div id="statusText">Loading...</div>
    <div class="track"><div id="statusBar" class="fill"></div></div>
  </section>

  <article id="doc" class="doc" hidden></article>
  <div id="pages" class="pages" hidden></div>

  <section id="notices" class="notices" hidden></section>
</main>

<div id="dragveil" class="dragveil" hidden><span>Drop to open</span></div>

<script src="../lib/segmenter.js"></script>
<script src="../lib/settings.js"></script>
<script src="../lib/translate.js"></script>
<script src="../content/speech.js"></script>
<script src="../content/engine.js"></script>
<script src="../content/ui.js"></script>
<script src="../content/controller.js"></script>
<script src="docx.js"></script>
<script src="pdf.js"></script>
<script src="reader.js"></script>
</body>
</html>
