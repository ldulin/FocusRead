<script>
/*
 * A speech engine we drive by hand.
 *
 * Installed BEFORE speech.js, which captures root.speechSynthesis at load.
 * Utterances are queued but never advance on their own: a test calls drive()
 * to decide exactly which piece starts, which emits boundaries, and which
 * fails. That makes the queue semantics - the part real timers make
 * untestable - deterministic.
 */
(function () {
  function FakeUtterance(text) {
    this.text = text;
    this.onstart = this.onend = this.onerror = this.onboundary = null;
  }
  var fake = {
    _queue: [],
    speaking: false, paused: false, pending: false,
    speak: function (u) { this._queue.push(u); this.pending = true; },
    cancel: function () {
      var q = this._queue.splice(0);
      this.speaking = false; this.pending = false;
      q.forEach(function (u) { if (u.onerror) u.onerror({ error: 'canceled' }); });
    },
    pause: function () { this.paused = true; },
    resume: function () { this.paused = false; },
    getVoices: function () {
      return [{ voiceURI: 'local-en', name: 'Local EN', lang: 'en-US', localService: true, default: true }];
    },
    addEventListener: function (_, fn) { if (fn) fn(); },
    removeEventListener: function () {}
  };
  Object.defineProperty(window, 'speechSynthesis', { value: fake, configurable: true });
  Object.defineProperty(window, 'SpeechSynthesisUtterance', { value: FakeUtterance, configurable: true });
  window.__fake = fake;

  /**
   * Like __drive, but lets opts.holdMs of real time pass before each utterance
   * ends. A merged run that reports no words can only be judged by the clock,
   * so "was cut off" and "took as long as saying it would" have to be
   * distinguishable in a test. Returns a promise.
   */
  window.__driveSlow = function (opts) {
    opts = opts || {};
    var queue = fake._queue.splice(0);
    var n = 0;
    return queue.reduce(function (chain, u) {
      return chain.then(function () {
        fake.speaking = true;
        if (u.onstart) u.onstart();
        (opts.boundaries || []).forEach(function (b) {
          if (u.onboundary) {
            u.onboundary({
              name: 'word',
              charIndex: b.charIndex,
              charLength: b.charLength === undefined ? 3 : b.charLength
            });
          }
        });
        return new Promise(function (r) { setTimeout(r, opts.holdMs || 0); });
      }).then(function () {
        if (u.onend) u.onend();
        n++;
      });
    }, Promise.resolve()).then(function () { fake.speaking = false; return n; });
  };

  /** Run the queued utterances. opts.failAt = index that errors instead of ending. */
  window.__drive = function (opts) {
    opts = opts || {};
    var i = 0;
    while (fake._queue.length) {
      var u = fake._queue.shift();
      fake.speaking = true;
      if (u.onstart) u.onstart();
      if (opts.boundariesPerPiece) {
        for (var b = 0; b < opts.boundariesPerPiece; b++) {
          if (u.onboundary) u.onboundary({ name: 'word', charIndex: b * 4, charLength: 3 });
        }
      }
      // A merged run needs boundaries at chosen offsets: which sentence the
      // reader is on is derived from them, so "some word somewhere" proves
      // nothing. A run that stops early is how a truncating voice behaves.
      if (opts.boundaries) {
        opts.boundaries.forEach(function (b) {
          if (u.onboundary) {
            u.onboundary({
              name: 'word',
              charIndex: b.charIndex,
              charLength: b.charLength === undefined ? 3 : b.charLength
            });
          }
        });
      }
      if (opts.failAt === i) {
        if (u.onerror) u.onerror({ error: 'synthesis-failed' });
      } else if (u.onend) {
        u.onend();
      }
      i++;
    }
    fake.speaking = false;
    return i;
  };
})();
</script>

<script src="../../src/lib/segmenter.js?v=1789335851"></script>
<script src="../../src/lib/settings.js?v=1789416460"></script>
<script src="../../src/lib/translate.js?v=1789357531"></script>
<script src="../../src/content/speech.js?v=1789431101"></script>

<script>
(function () {
  var pass = 0, fail = 0, lines = [];
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  function eq(label, got, want) {
    var ok = JSON.stringify(got) === JSON.stringify(want);
    ok ? pass++ : fail++;
    lines.push((ok ? '[PASS] ' : '[FAIL] ') + label +
      (ok ? '' : '\n        want: ' + JSON.stringify(want) + '\n        got : ' + JSON.stringify(got)));
  }
  function section(t) { lines.push('\n--- ' + t + ' ---'); }
  function merge2(stored) { return stored && stored.pdfView; }

  var LONG = 'One two three four five. Six seven eight nine ten. ' +
             'Eleven twelve thirteen fourteen. Fifteen sixteen seventeen eighteen.';

  function recorder() {
    var ev = { start: 0, end: 0, error: [], boundary: [] };
    return {
      ev: ev,
      opts: {
        maxChars: 40, localOnly: true, rate: 1,
        onstart: function () { ev.start++; },
        onend: function () { ev.end++; },
        onerror: function (e) { ev.error.push(e.error); },
        onboundary: function (b) { ev.boundary.push(b.charIndex); }
      }
    };
  }

  async function run() {
    /* ============ settings: an older install is brought forward ============
     * FIRST, before anything else touches settings: the module caches the
     * merged copy on the first read, so a migration can only be observed on a
     * cold cache - which is exactly the situation it exists for, a returning
     * reader's first page load.
     */
    section('settings - an older install is brought forward');

    // Settings as v1 would have written them, with the view the reader had.
    await new Promise(function (r) {
      chrome.storage.local.set({ settings: {
        schemaVersion: 1, pdfView: 'reflow', rate: 1.4
      } }, r);
    });

    var mig = await FR.settings.get();
    eq('the new default view reaches an install that predates it', mig.pdfView, 'split');
    eq('their own unrelated settings are left alone', mig.rate, 1.4);
    eq('and the schema is marked as migrated', mig.schemaVersion, FR.settings.SCHEMA);

    var persisted = await new Promise(function (r) {
      chrome.storage.local.get('settings', function (o) { r(o.settings); });
    });
    eq('the migration is written back, not just applied in memory',
       persisted.schemaVersion, FR.settings.SCHEMA);
    eq('and written back complete, not as a fragment', persisted.pdfView, 'split');

    // A choice made after the migration has to survive: re-migrating on every
    // read would quietly undo it on the next page load.
    await FR.settings.set({ pdfView: 'reflow' });
    var after = await new Promise(function (r) {
      chrome.storage.local.get('settings', function (o) { r(o.settings); });
    });
    eq('a later choice of the old view is not migrated away again',
       after.pdfView, 'reflow');
    await FR.settings.reset();

    /* ================= speech: normal path ================= */
    section('speech - normal completion');
    var r = recorder();
    var p = FR.speech.speak(LONG, r.opts);
    await sleep(90);
    var queued = window.__fake._queue.length;
    eq('a long sentence is split into several utterances', queued > 1, true);
    window.__drive({ boundariesPerPiece: 2 });
    await p.catch(function () {});
    await sleep(20);
    eq('onstart fires exactly once for the whole sentence', r.ev.start, 1);
    eq('onend fires exactly once', r.ev.end, 1);
    eq('no error was reported', r.ev.error, []);
    eq('boundaries are absolute offsets into the full sentence',
       r.ev.boundary.every(function (ci) { return ci >= 0 && ci < LONG.length; }), true);
    eq('boundaries from later pieces are past the first piece',
       Math.max.apply(null, r.ev.boundary) > 40, true);

    /* ========== speech: a piece fails mid-queue (the critical bug) ========== */
    section('speech - failure mid-queue');
    var r2 = recorder();
    var p2 = FR.speech.speak(LONG, r2.opts);
    await sleep(90);
    var total = window.__fake._queue.length;
    eq('several pieces are queued before the failure', total > 2, true);
    window.__drive({ failAt: 1 });
    await p2.catch(function () {});
    await sleep(20);
    eq('the error is reported exactly once', r2.ev.error, ['synthesis-failed']);
    eq('onend does NOT fire for a sentence that failed', r2.ev.end, 0);
    eq('the remaining pieces are flushed from the queue', window.__fake._queue.length, 0);

    var boundariesAfterFailure = r2.ev.boundary.length;
    window.__drive({ boundariesPerPiece: 3 });   // anything still queued would speak
    await sleep(20);
    eq('no boundary events arrive after the failure',
       r2.ev.boundary.length, boundariesAfterFailure);

    /* ================= speech: cancel ================= */
    section('speech - cancel');
    var r3 = recorder();
    var p3 = FR.speech.speak(LONG, r3.opts);
    await sleep(90);
    FR.speech.cancel();
    await p3.catch(function () {});
    await sleep(20);
    eq('cancel reports no error to the caller', r3.ev.error, []);
    eq('cancel does not fire onend', r3.ev.end, 0);
    eq('cancel empties the queue', window.__fake._queue.length, 0);

    /* ================= speech: lagWord ================= */
    section('speech - one-word lag');
    var r4 = recorder();
    r4.opts.lagWord = true;
    var p4 = FR.speech.speak('Alpha beta gamma delta epsilon zeta.', r4.opts);
    await sleep(90);
    window.__drive({ boundariesPerPiece: 3 });
    await p4.catch(function () {});
    await sleep(20);
    eq('lagWord still delivers every word', r4.ev.boundary.length >= 3, true);
    eq('lagWord flushes the final word at end', r4.ev.end, 1);

    /* ================= speech: rate clamping ================= */
    section('speech - clamping');
    eq('rate is clamped below the silent-voice threshold', FR.speech.RATE_MAX <= 2, true);
    eq('splitForSpeech never exceeds the cap',
       FR.speech.splitForSpeech(LONG, 80).every(function (p) { return p.end - p.start <= 80; }), true);
    eq('splitForSpeech covers the whole string',
       FR.speech.splitForSpeech(LONG, 80).reduce(function (n, p) { return n + (p.end - p.start); }, 0) >= LONG.trim().length - 4,
       true);
    eq('a cap below the safe floor is raised, not honoured literally',
       FR.speech.splitForSpeech(LONG, 10).every(function (p) { return p.end - p.start <= 60; }), true);

    /* ========== engine: groupSelector (the PDF text-layer case) ========== */
    section('engine - groupSelector');
    (function () {
      // A PDF text layer is absolutely positioned spans: each computes to
      // display:block, so without groupSelector every LINE is its own block
      // and no sentence can span a line break.
      var host = document.createElement('div');
      host.style.cssText = 'position:relative;width:400px;height:200px';
      host.innerHTML =
        '<div class="fr-para">' +
        '<span style="position:absolute;top:0">Prior work showed an</span> ' +
        '<span style="position:absolute;top:20px">effect at p &lt; 0.05. We</span> ' +
        '<span style="position:absolute;top:40px">replicated it here.</span>' +
        '</div>';
      document.body.appendChild(host);

      var plain = new FR.Engine(host, {});
      plain.scan();
      var plainTexts = plain.sentences.map(function (r) { return r.text; });
      plain.detach();

      var grouped = new FR.Engine(host, { groupSelector: '.fr-para' });
      grouped.scan();
      var groupedTexts = grouped.sentences.map(function (r) { return r.text; });
      var marks = grouped.sentences.map(function (r) { return r.marks.length; });
      grouped.detach();
      host.remove();

      eq('without groupSelector every line is its own unit', plainTexts.length, 3);
      eq('with groupSelector the lines become sentences', groupedTexts.length, 2);
      eq('a sentence spans the line break', groupedTexts[0],
         'Prior work showed an effect at p < 0.05.');
      eq('and is marked in more than one place', marks[0] > 1, true);
      eq('the second sentence is intact', groupedTexts[1], 'We replicated it here.');
    })();

    /* ================= settings: the key-wipe bug ================= */
    section('settings - provider config is not clobbered');
    await FR.settings.reset();
    await FR.settings.set({ providerConfig: { openai: { key: 'sk-OPENAI', model: 'gpt-4o-mini' } } });
    await FR.settings.set({ providerConfig: { libre: { url: 'http://localhost:5000' } } });
    await FR.settings.set({ providerConfig: { google: { key: 'AIza-GOOGLE' } } });
    await FR.settings.set({ providerConfig: { mymemory: { email: 'a@b.edu' } } });
    var s = await FR.settings.get();
    eq('the OpenAI key survives three later provider saves', s.providerConfig.openai.key, 'sk-OPENAI');
    eq('the OpenAI model survives', s.providerConfig.openai.model, 'gpt-4o-mini');
    eq('the LibreTranslate URL survives', s.providerConfig.libre.url, 'http://localhost:5000');
    eq('the Google key survives', s.providerConfig.google.key, 'AIza-GOOGLE');
    eq('the MyMemory email survives', s.providerConfig.mymemory.email, 'a@b.edu');

    await FR.settings.set({ rate: 1.5 });
    var s2 = await FR.settings.get();
    eq('a top-level save leaves provider keys alone', s2.providerConfig.openai.key, 'sk-OPENAI');
    eq('the top-level value is stored', s2.rate, 1.5);

    await FR.settings.set({ providerConfig: { openai: { key: 'sk-NEW' } } });
    var s3 = await FR.settings.get();
    eq('a provider field can still be updated', s3.providerConfig.openai.key, 'sk-NEW');
    eq('its sibling field is preserved', s3.providerConfig.openai.model, 'gpt-4o-mini');

    section('settings - listeners');
    var hits = 0;
    var h = FR.settings.onChange(function () { hits++; });
    eq('onChange returns a handle', typeof h, 'function');
    FR.settings.offChange(h);
    eq('offChange removes the listener', FR.settings._listeners.indexOf(h), -1);

    /* ================= translate: byte chunking ================= */
    section('translation - MyMemory byte cap');
    var enc = new TextEncoder();
    var bytes = function (x) { return enc.encode(x).length; };

    var prose = 'The effect replicated across every cohort, and the confidence intervals ' +
                'were narrow enough to rule out the alternative account we had considered. ' +
                'Participants completed four sessions, each lasting about ninety minutes.';
    var chunksA = FR.translate.byteChunks(prose, 120);
    eq('prose is split under the byte cap',
       chunksA.every(function (c) { return bytes(c) <= 120; }), true);
    eq('no words are lost when splitting prose',
       chunksA.join(' ').replace(/\s+/g, ' ').trim().split(' ').length,
       prose.replace(/\s+/g, ' ').trim().split(' ').length);

    // The case that used to emit an oversize chunk: one token, no whitespace.
    var giant = 'https://example.org/' + 'a'.repeat(400);
    var chunksB = FR.translate.byteChunks(giant, 120);
    eq('a single unspaced token is hard-split under the cap',
       chunksB.every(function (c) { return bytes(c) <= 120; }), true);
    eq('the unspaced token is preserved exactly', chunksB.join(''), giant);

    // CJK burns 3 bytes per character, so character counts are no guide.
    var cjk = '\u6211\u4eec\u4f7f\u7528\u4e86\u5df4\u7279\u6c83\u601d\u6ee4\u6ce2\u5668'.repeat(30);
    var chunksC = FR.translate.byteChunks(cjk, 120);
    eq('CJK is chunked by bytes, not characters',
       chunksC.every(function (c) { return bytes(c) <= 120; }), true);
    eq('no CJK characters are lost', chunksC.join(''), cjk);
    eq('no chunk ends inside a surrogate pair',
       chunksC.every(function (c) { return !/[\uD800-\uDBFF]$/.test(c); }), true);

    eq('short text is returned untouched', FR.translate.byteChunks('Short.', 480), ['Short.']);

    section('speech - the voice list is never cached for good');

    // Edge registers its "Online (Natural)" voices after the local ones. A
    // list captured on the first read is missing exactly the voice a reader is
    // most likely to have picked - and everything decided from it, including
    // whether to read a paragraph in one breath, is then about a voice that
    // was never going to speak.
    var realVoices = window.__fake.getVoices;
    var LOCAL_ONLY = [{ voiceURI: 'local-en', name: 'Local EN', lang: 'en-US', localService: true }];
    var WITH_NET = LOCAL_ONLY.concat([
      { voiceURI: 'net-en', name: 'Net Online (Natural)', lang: 'en-US', localService: false }
    ]);

    window.__fake.getVoices = function () { return LOCAL_ONLY; };
    var earlyList = await FR.speech.getVoices();
    window.__fake.getVoices = function () { return WITH_NET; };
    var laterList = await FR.speech.getVoices();
    var sync = FR.speech.voicesNow();
    window.__fake.getVoices = realVoices;

    eq('an early read sees only what has registered so far', earlyList.length, 1);
    eq('a later read sees the voices that arrived after it', laterList.length, 2);
    eq('so a network voice registered late is not invisible',
       laterList.filter(function (v) { return !v.localService; }).length, 1);
    eq('and it can be read without waiting', sync.length, 2);

    /* ================= gapless runs ================= */
    section('speech - a run of sentences in one utterance');

    var RUN = [
      { i: 3, text: 'Alpha beta gamma.' },      // [0, 17)
      { i: 4, text: 'Delta epsilon zeta.' },    // [18, 37)
      { i: 5, text: 'Eta theta iota.' }         // [38, 53)
    ];

    function runRecorder() {
      var ev = { start: 0, end: [], sentences: [], words: [], truncated: [], error: [] };
      return {
        ev: ev,
        opts: {
          rate: 1, localOnly: true,
          onstart: function () { ev.start++; },
          onsentence: function (i) { ev.sentences.push(i); },
          onboundary: function (i, b) { ev.words.push([i, b.charIndex]); },
          onend: function (e) { ev.end.push(e.index); },
          ontruncated: function (e) { ev.truncated.push(e.index); },
          onerror: function (e) { ev.error.push(e.error); }
        }
      };
    }

    var rr = runRecorder();
    var rp = FR.speech.speakRun(RUN, rr.opts);
    await sleep(90);
    eq('the whole run is a single utterance, however long it is',
       window.__fake._queue.length, 1);
    eq('and it holds every sentence, joined',
       window.__fake._queue[0].text, 'Alpha beta gamma. Delta epsilon zeta. Eta theta iota.');

    // Words at 0 (first sentence), 18 and 25 (second), 38 and 50 (third).
    window.__drive({ boundaries: [
      { charIndex: 0, charLength: 5 }, { charIndex: 18, charLength: 5 },
      { charIndex: 25, charLength: 7 }, { charIndex: 38, charLength: 3 },
      { charIndex: 50, charLength: 4 }
    ] });
    await rp.catch(function () {});
    await sleep(20);

    eq('onstart still fires once for the run', rr.ev.start, 1);
    eq('each sentence is announced once, in order', rr.ev.sentences, [3, 4, 5]);
    eq('word offsets are reported inside the right sentence',
       rr.ev.words, [[3, 0], [4, 0], [4, 7], [5, 0], [5, 12]]);
    eq('the run ends on its last sentence', rr.ev.end, [5]);
    eq('a completed run is not mistaken for a truncated one', rr.ev.truncated, []);
    eq('no error', rr.ev.error, []);

    section('speech - a voice that cuts the run off');

    var rt = runRecorder();
    var tp = FR.speech.speakRun(RUN, rt.opts);
    await sleep(90);
    // It speaks the first sentence and then stops, reporting a normal end.
    window.__drive({ boundaries: [{ charIndex: 0, charLength: 5 }, { charIndex: 6, charLength: 4 }] });
    await tp.catch(function () {});
    await sleep(20);
    eq('stopping a fifth of the way in is reported as truncation', rt.ev.truncated, [3]);
    eq('and not as a normal end', rt.ev.end, []);
    eq('the sentences it did reach were still announced', rt.ev.sentences, [3]);

    section('speech - a voice that reports no words at all');

    // RUN is 53 chars / 9 words. At rate 2 that is 9 x 166ms = 1.5s of
    // reading, so ending inside 750ms is proof of a cut and holding past it
    // is proof of none - the clock is the only witness such a voice leaves.
    var rq = runRecorder();
    rq.opts.rate = 2;
    var qp = FR.speech.speakRun(RUN, rq.opts);
    await sleep(90);
    window.__drive({});                                 // ends in the same tick
    await qp.catch(function () {});
    await sleep(20);
    eq('ending in no time at all is a cut, not a finished run', rq.ev.truncated, [3]);
    eq('so the run is not reported as read', rq.ev.end, []);

    var rs = runRecorder();
    rs.opts.rate = 2;
    var sp2 = FR.speech.speakRun(RUN, rs.opts);
    await sleep(90);
    await window.__driveSlow({ holdMs: 900 });          // took as long as saying it
    await sp2.catch(function () {});
    await sleep(20);
    eq('taking as long as the words would is a finished run', rs.ev.end, [5]);
    eq('and is not reported as a cut', rs.ev.truncated, []);

    section('speech - a cut that a fraction-of-the-run test cannot see');

    // 53 chars, and the sentence that is lost is the last 5 of them: the words
    // reach 47/53 = 89% of the run, so any "did it get most of the way" test
    // calls this finished and the reader never hears the last sentence.
    var TAIL_RUN = [
      { i: 20, text: 'Alpha beta gamma delta.' },     // [0, 23)
      { i: 21, text: 'Epsilon zeta eta theta.' },     // [24, 47)
      { i: 22, text: 'Iota.' }                        // [48, 53)
    ];
    var rc = runRecorder();
    rc.opts.rate = 2;
    var cp = FR.speech.speakRun(TAIL_RUN, rc.opts);
    await sleep(90);
    window.__drive({ boundaries: [
      { charIndex: 0, charLength: 5 }, { charIndex: 18, charLength: 5 },
      { charIndex: 24, charLength: 7 }, { charIndex: 42, charLength: 5 }
    ] });
    await cp.catch(function () {});
    await sleep(20);
    eq('the unspoken last sentence is caught', rc.ev.truncated, [22]);
    eq('and the run is not reported as read', rc.ev.end, []);
    eq('the sentences that were spoken were still announced', rc.ev.sentences, [20, 21]);

    section('speech - a stingy voice is not mistaken for a cut');

    // Words land in the first and last sentence but none in the middle one.
    // That is a voice being sparing with events, not a cut: a cut cannot
    // resume after the gap it made.
    var rg = runRecorder();
    rg.opts.rate = 2;
    var gp = FR.speech.speakRun(TAIL_RUN, rg.opts);
    await sleep(90);
    window.__drive({ boundaries: [
      { charIndex: 0, charLength: 5 }, { charIndex: 48, charLength: 4 }
    ] });
    await gp.catch(function () {});
    await sleep(20);
    eq('a hole in the middle is not a cut', rg.ev.truncated, []);
    eq('the run is reported as read', rg.ev.end, [22]);

    section('speech - a cut inside the last sentence');

    var rl = runRecorder();
    rl.opts.rate = 2;
    var lp = FR.speech.speakRun(TAIL_RUN, rl.opts);
    await sleep(90);
    // Words in all three sentences, but they stop after the first word of the
    // last one - which here is its only word, so the run IS complete.
    window.__drive({ boundaries: [
      { charIndex: 0, charLength: 5 }, { charIndex: 24, charLength: 7 },
      { charIndex: 48, charLength: 4 }
    ] });
    await lp.catch(function () {});
    await sleep(20);
    eq('reaching the end of the last sentence is a finished run', rl.ev.end, [22]);

    var rm = runRecorder();
    rm.opts.rate = 2;
    var mp = FR.speech.speakRun([
      { i: 30, text: 'Alpha beta.' },
      { i: 31, text: 'A much longer closing sentence that carries on well past the middle of itself.' }
    ], rm.opts);
    await sleep(90);
    // It gets four words into a 78-character sentence and stops.
    window.__drive({ boundaries: [
      { charIndex: 0, charLength: 5 }, { charIndex: 12, charLength: 1 },
      { charIndex: 14, charLength: 4 }, { charIndex: 19, charLength: 6 }
    ] });
    await mp.catch(function () {});
    await sleep(20);
    eq('stopping part-way through the last sentence is a cut', rm.ev.truncated, [31]);

    section('speech - an out-of-range offset must not hijack the run');

    // Quirk 4: speak() clamps an out-of-range charIndex to the last character
    // of the utterance, which in a run belongs to the LAST sentence. Believing
    // it would strand the highlight there and hide the cut.
    var rj = runRecorder();
    rj.opts.rate = 2;
    var jp = FR.speech.speakRun(TAIL_RUN, rj.opts);
    await sleep(90);
    window.__drive({ boundaries: [
      { charIndex: 0, charLength: 5 },
      { charIndex: 9999, charLength: 4 },               // arrives clamped to 52
      { charIndex: 6, charLength: 4 }, { charIndex: 11, charLength: 5 }
    ] });
    await jp.catch(function () {});
    await sleep(20);
    eq('the reader is not dragged to the last sentence', rj.ev.sentences, [20]);
    eq('every word is still reported inside the first sentence',
       rj.ev.words.map(function (w) { return w[0]; }), [20, 20, 20]);
    // Sentence 20 itself, not 21: its words stopped at 'gamma', 7 characters
    // short of its end, so resuming at 21 would lose 'delta.' unread.
    eq('and the cut it would have hidden is still found', rj.ev.truncated, [20]);

    // An offset that is wrong but IN range is not clamped, so distance is the
    // only thing left to judge it by.
    var LONG_RUN = [
      { i: 40, text: 'A' + new Array(60).join(' word') + '.' },   // 296 chars
      { i: 41, text: 'B' + new Array(60).join(' word') + '.' }
    ];
    var rd = runRecorder();
    rd.opts.rate = 2;
    var dp = FR.speech.speakRun(LONG_RUN, rd.opts);
    await sleep(90);
    window.__drive({ boundaries: [
      { charIndex: 2, charLength: 4 },
      { charIndex: 400, charLength: 4 },                // in range, 398 ahead
      { charIndex: 7, charLength: 4 }
    ] });
    await dp.catch(function () {});
    await sleep(20);
    eq('an offset that skips too far ahead is disbelieved', rd.ev.sentences, [40]);

    section('speech - a run of one behaves like a plain sentence');

    var ro = runRecorder();
    var op = FR.speech.speakRun([{ i: 7, text: 'Just the one sentence here.' }], ro.opts);
    await sleep(90);
    eq('one utterance', window.__fake._queue.length, 1);
    window.__drive({ boundaries: [{ charIndex: 0, charLength: 4 }, { charIndex: 22, charLength: 4 }] });
    await op.catch(function () {});
    await sleep(20);
    eq('its sentence is announced', ro.ev.sentences, [7]);
    eq('and it ends cleanly', ro.ev.end, [7]);
    eq('reaching the last word is not truncation', ro.ev.truncated, []);

    eq('an empty run ends immediately rather than hanging',
       (await (function () {
          var e = [];
          return FR.speech.speakRun([], { onend: function (x) { e.push(x.spoken); } })
            .then(function () { return e; });
        })()), [0]);

    document.getElementById('out').dataset.done = '1';

    document.getElementById('out').innerHTML =
      (lines.join('\n') + '\n\n==== ' + pass + ' passed, ' + fail + ' failed ====')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/^\[PASS\]/gm, '<span class="p">[PASS]</span>')
        .replace(/^\[FAIL\]/gm, '<span class="f">[FAIL]</span>');
    document.title = fail ? ('FAIL ' + fail) : ('PASS ' + pass);
    window.__result = { pass: pass, fail: fail, lines: lines };
  }

  run().catch(function (e) {
    document.getElementById('out').textContent = 'HARNESS ERROR: ' + (e && e.stack || e);
    window.__result = { pass: pass, fail: fail, lines: lines, error: String(e) };
    document.title = 'ERROR';
  });
})();
</script>
</body></html>
