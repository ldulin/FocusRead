<!doctype html><meta charset="utf-8"><title>engine order test</title>
<div id="root">
<ul>
  <li>Install the package.
    <ul><li>On macOS use brew.</li></ul>
    Then run the tests.
  </li>
</ul>
<div>
  Intro text goes here.
  <blockquote>A quoted line sits here.</blockquote>
  Continuation text follows.
</div>
</div>
<pre id="out"></pre>
<script src="../src/lib/segmenter.js"></script>
<script src="../src/content/engine.js"></script>
<script>
var e = new FR.Engine(document.getElementById('root'));
var blocks = e._collectBlocks(document.getElementById('root'));
var lines = blocks.map(function(b,i){
  return 'block '+i+' <'+b.el.tagName+'> pieces='+b.pieces.length+' text='+JSON.stringify(b.text);
});
e.scan().then(function(n){
  lines.push('--- sentences ('+n+') ---');
  e.sentences.forEach(function(r){ lines.push(r.i+': marks='+r.marks.length+' '+JSON.stringify(r.text)); });
  var bad = [];
  for (var i=1;i<e.sentences.length;i++){
    var a=e.sentences[i-1].marks[0], b=e.sentences[i].marks[0];
    if (a&&b && (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_PRECEDING)) bad.push((i-1)+'->'+i);
  }
  lines.push('--- backwards transitions: '+(bad.join(', ')||'none'));
  lines.push('--- firstVisible(): '+e.firstVisible());
  document.getElementById('out').textContent = lines.join('\n');
});
</script>
