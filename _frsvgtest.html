<!doctype html>
<html><head><meta charset="utf-8"><title>svg test</title></head>
<body>
<p id="prose">This is an ordinary paragraph of prose. It has two sentences.</p>

<div id="chartwrap">
<svg id="chart" width="300" height="120" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="60" width="40" height="50" fill="steelblue"></rect>
  <text id="axis" x="10" y="40">Revenue</text>
</svg>
</div>

<div id="mathwrap">
<math id="m1"><mrow><mi>E</mi><mo>=</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></math>
</div>

<script src="/src/lib/segmenter.js"></script>
<script src="/src/content/engine.js"></script>
<script>
window.RESULT = {};
function run() {
  var R = window.RESULT;
  var svg = document.getElementById('chart');
  var txt = document.getElementById('axis');
  var math = document.getElementById('m1');
  var p = document.getElementById('prose');

  R.tagNames = {
    svg: svg.tagName,
    svgText: txt.tagName,
    math: math.tagName,
    p: p.tagName
  };
  R.namespaces = { svg: svg.namespaceURI, math: math.namespaceURI, p: p.namespaceURI };

  var isSkipped = FR.engineUtils.isSkipped;
  R.isSkipped = {
    svg: isSkipped(svg),
    svgText: isSkipped(txt),
    math: isSkipped(math)
  };

  // Baseline geometry of the SVG text before any wrapping.
  R.before = {};
  try { var bb = txt.getBBox(); R.before.bbox = { w: bb.width, h: bb.height }; } catch (e) { R.before.bboxErr = String(e); }
  R.before.rects = txt.getClientRects().length;
  R.before.html = document.getElementById('chartwrap').innerHTML;
  R.before.mathHtml = document.getElementById('mathwrap').innerHTML;

  var eng = new FR.Engine(document.body, {});
  return eng.scan().then(function (n) {
    R.sentenceCount = n;
    R.sentences = eng.sentences.map(function (s) {
      return { i: s.i, text: s.text, blockTag: s.blockEl.tagName, marks: s.marks.length };
    });
    R.after = {};
    try { var bb2 = txt.getBBox(); R.after.bbox = { w: bb2.width, h: bb2.height }; } catch (e) { R.after.bboxErr = String(e); }
    R.after.rects = txt.getClientRects().length;
    R.after.html = document.getElementById('chartwrap').innerHTML;
    R.after.mathHtml = document.getElementById('mathwrap').innerHTML;
    R.after.frsInSvg = document.querySelectorAll('#chart fr-s').length;
    var fs = document.querySelector('#chart fr-s');
    if (fs) R.after.frsNamespace = fs.namespaceURI;

    eng.detach();
    R.afterDetach = { html: document.getElementById('chartwrap').innerHTML };
    try { var bb3 = txt.getBBox(); R.afterDetach.bbox = { w: bb3.width, h: bb3.height }; } catch (e) {}
    R.done = true;
    return n;
  });
}
window.addEventListener('load', function () {
  run().catch(function (e) { window.RESULT.error = String(e && e.stack || e); window.RESULT.done = true; });
});
</script>
</body></html>
